services:
  1ai-ads:
    build: .
    container_name: 1ai-ads
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/data/1ai-ads.db
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ["CMD", "node", "-e", "import('http').then(h=>h.get('http://localhost:5000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
