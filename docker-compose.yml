# Unified Docker Compose for 1ai-ads + 1ai-social + 1ai-content
# Run: docker compose up -d

version: "3.9"

networks:
  1ai-net:
    driver: bridge

services:
  # ─── 1ai-ads (Express + SQLite) ───
  1ai-ads:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1ai-ads
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/adforge.db
      - MCP_ENABLED=true
    volumes:
      - ads-data:/data
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ─── 1ai-social (FastAPI + PostgreSQL + Redis) ───
  1ai-social:
    build:
      context: ../1ai-social
      dockerfile: Dockerfile
    container_name: 1ai-social
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@social-db:5432/ai_social
      - REDIS_URL=redis://social-redis:6379/0
    depends_on:
      social-db:
        condition: service_healthy
      social-redis:
        condition: service_healthy
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  social-db:
    image: postgres:16-alpine
    container_name: social-db
    environment:
      - POSTGRES_DB=ai_social
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - social-db-data:/var/lib/postgresql/data
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  social-redis:
    image: redis:7-alpine
    container_name: social-redis
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── 1ai-content (TypeScript + BullMQ + Redis) ───
  1ai-content:
    build:
      context: ../1ai-content
      dockerfile: Dockerfile
    container_name: 1ai-content
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@content-db:5432/ai_content
      - REDIS_URL=redis://content-redis:6379/0
      - PORT=3001
    depends_on:
      content-db:
        condition: service_healthy
      content-redis:
        condition: service_healthy
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  content-db:
    image: postgres:16-alpine
    container_name: content-db
    environment:
      - POSTGRES_DB=ai_content
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - content-db-data:/var/lib/postgresql/data
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  content-redis:
    image: redis:7-alpine
    container_name: content-redis
    networks:
      - 1ai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ads-data:
  social-db-data:
  content-db-data:
