  <style>
    /* ─── RESPONSIVE NAVIGATION SYSTEM ─── */
    
    /* Base nav styles */
    #nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0;
      list-style: none;
      margin: 0;
      width: 100%;
    }

    /* Mobile: Hidden by default */
    @media (max-width: 1023px) {
      #nav-links {
        position: fixed;
        top: 64px;
        left: 0;
        right: 0;
        background: linear-gradient(to bottom, #0d1117, #161b22);
        border-bottom: 1px solid #30363d;
        padding: 0.5rem 0;
        max-height: calc(100vh - 64px);
        overflow-y: auto;
        z-index: 40;
        transform: translateY(-100%);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      #nav-links.nav-open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }
    }

    /* Desktop: Always visible, horizontal */
    @media (min-width: 1024px) {
      #nav-links {
        flex-direction: row !important;
        position: static !important;
        width: auto !important;
        padding: 0 !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        transform: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        gap: 0.25rem;
        display: flex !important;
      }
    }

    /* Nav item styling */
    #nav-links a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      color: #8b949e;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 0.5rem;
      transition: all 0.2s ease;
      white-space: nowrap;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #nav-links a:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.05);
    }

    #nav-links a.nav-active {
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Mobile menu toggle button */
    #menu-toggle {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      width: 2rem;
      height: 2rem;
      padding: 0.4rem;
      background: transparent;
      border: 1px solid #30363d;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      align-items: center;
      justify-content: center;
    }

    #menu-toggle:hover {
      border-color: #6366f1;
      background-color: rgba(99, 102, 241, 0.1);
    }

    #menu-toggle span {
      display: block;
      width: 1.2rem;
      height: 0.15rem;
      background-color: #8b949e;
      border-radius: 0.1rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #menu-toggle.menu-open span:nth-child(1) {
      transform: rotate(45deg) translate(0.5rem, 0.5rem);
    }

    #menu-toggle.menu-open span:nth-child(2) {
      opacity: 0;
    }

    #menu-toggle.menu-open span:nth-child(3) {
      transform: rotate(-45deg) translate(0.35rem, -0.35rem);
    }

    @media (max-width: 1023px) {
      #menu-toggle {
        display: flex !important;
      }
    }

    /* Desktop: Hide hamburger button (defined in media query below) */

    /* Mobile backdrop */
    #nav-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 35;
    }

    #nav-backdrop.show {
      display: block;
    }

    @media (min-width: 1024px) {
      #nav-backdrop {
        display: none !important;
      }
    }
  </style>

  <!-- Keep all other head content from original -->
  <script>
    // Global notification system
    window.vn = {
      toast: function(title, msg, type, dur) {
        type = type || 'info';
        dur = dur === undefined ? 3000 : dur;
        var icons = {success:'✅',error:'❌',warning:'⚠️',info:'ℹ️',revenue:'💰'};
        var t = document.createElement('div');
        t.className = 'vn-toast vn-toast-' + type;
        t.innerHTML = '<span class="vn-toast-icon">'+(icons[type]||icons.info)+'</span><div class="vn-toast-body"><div class="vn-toast-title">'+title+'</div><div class="vn-toast-msg">'+msg+'</div></div><button class="vn-toast-close" onclick="this.parentElement.remove()">✕</button>';
        if(dur>0) setTimeout(function(){ t.classList.add('removing'); setTimeout(function(){ t.remove(); },150); }, dur);
        var c = document.getElementById('vnToastContainer');
        while(c.children.length >= 5) c.firstChild.remove();
        c.appendChild(t);
        return t;
      },
      success: function(msg,title){ return this.toast(title||'Success',msg,'success'); },
      error: function(msg,title){ return this.toast(title||'Error',msg,'error',0); },
      warn: function(msg,title){ return this.toast(title||'Warning',msg,'warning'); },
      info: function(msg,title){ return this.toast(title||'Info',msg,'info'); }
    };
  </script>
</head>
<body>
  <!-- Mobile Backdrop -->
  <div id="nav-backdrop"></div>

  <!-- Mobile Backdrop -->

  <!-- Menu Initialization Script -->
  <script>
  (function initializeMenu() {
    const navLinks = document.getElementById('nav-links');
    const menuToggle = document.getElementById('menu-toggle');
    const navBackdrop = document.getElementById('nav-backdrop');
    
    // CRITICAL: Check all 3 elements exist
    if (!navLinks || !menuToggle || !navBackdrop) {
      console.error('Menu elements not found in DOM');
      return;
    }

    const menuItems = [
      { label: '📊 Dashboard', href: '#/' },
      { label: '📢 Campaigns', href: '#/campaigns' },
      { label: '🌐 Platforms', href: '#/platforms' },
      { label: '🎨 Creatives', href: '#/ads' },
      { label: '📄 Landing', href: '#/landing' },
      { label: '📈 Analytics', href: '#/analytics' },
      { label: '🔥 Trending', href: '#/trending' },
      { label: '🕵️ Spy', href: '#/competitor-spy' },
      { label: '🌍 Global', href: '#/global-ads' },
      { label: '🤖 Meta AI', href: '#/meta-ai' },
      { label: '📚 Ad Library', href: '#/ads-library-ai' },
      { label: '⚡ Research', href: '#/research' },
      { label: '👤 Creator', href: '#/creator' },
      { label: '📋 Drafts', href: '#/drafts' },
      { label: '📊 Monitor', href: '#/campaign-monitor' },
      { label: '🛒 Shopee', href: '#/shopee' },
      { label: '🎨 Fatigue', href: '#/fatigue' },
      { label: '🧪 A/B Tests', href: '#/ab-tests' },
      { label: '📊 Unified', href: '#/unified' },
      { label: '📚 Library', href: '#/creative-library' },
      { label: '🎛️ Builder', href: '#/dashboard-builder' },
    ];

    function renderMenu() {
      navLinks.innerHTML = menuItems
        .map(item => 
          `<li><a href="${item.href}" class="nav-item">${item.label}</a></li>`
        )
        .join('');
      
      // FIX: Use event delegation to prevent memory leaks
      // Remove old click listener if exists
      navLinks.removeEventListener('click', handleNavLinkClick);
      // Add single delegated listener
      navLinks.addEventListener('click', handleNavLinkClick);
    }
    
    // Event delegation handler for nav links
    function handleNavLinkClick(e) {
      if (e.target.tagName === 'A') {
        closeMenu();
        // Don't call updateActiveLink here - let hashchange event do it
      }
    }

    function closeMenu() {
      navLinks.classList.remove('nav-open');
      menuToggle.classList.remove('menu-open');
      navBackdrop?.classList.remove('show');  // FIX: Optional chaining
      menuToggle.setAttribute('aria-expanded', 'false');  // Already string
    }

    function toggleMenu() {
      const isOpen = navLinks.classList.toggle('nav-open');
      menuToggle.classList.toggle('menu-open');
      navBackdrop?.classList.toggle('show');  // FIX: Optional chaining
      // FIX: Convert boolean to string for ARIA attribute
      menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    function updateActiveLink() {
      const currentHash = window.location.hash || '#/';
      navLinks.querySelectorAll('a').forEach(link => {
        link.classList.toggle('nav-active', link.getAttribute('href') === currentHash);
      });
    }

    menuToggle.addEventListener('click', toggleMenu);
    // FIX: Optional chaining - backdrop may not exist in future
    navBackdrop?.addEventListener('click', closeMenu);

    // FIX: Debounce resize event to prevent excessive function calls
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (window.innerWidth >= 1024) closeMenu();
      }, 150);
    });

    window.addEventListener('hashchange', updateActiveLink);

    const observer = new MutationObserver(() => {
      const isMenuOpen = navLinks.classList.contains('nav-open');
      document.body.style.overflow = isMenuOpen ? 'hidden' : 'auto';
    });

    observer.observe(navLinks, { attributes: true, attributeFilter: ['class'] });

    renderMenu();
    updateActiveLink();
  })();
  </script>
</body>
</html>
