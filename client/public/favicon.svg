<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0f1d"/>
  <!-- Outer ring arc (top-right) -->
  <path d="M32 8 A24 24 0 0 1 56 32" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Outer ring arc (bottom-left) -->
  <path d="M32 56 A24 24 0 0 1 8 32" stroke="#00e5ff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- Inner diamond / forge shape -->
  <polygon points="32,16 44,32 32,44 20,32" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#00e5ff"/>
  <!-- Tick mark — top right accent -->
  <circle cx="56" cy="32" r="3" fill="#00e5ff"/>
  <!-- Tick mark — bottom left accent -->
  <circle cx="8" cy="32" r="3" fill="#00e5ff" opacity="0.35"/>
</svg>
