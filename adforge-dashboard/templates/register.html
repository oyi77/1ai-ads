<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdForge — Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #14141f 50%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f1f7;
        }
        .login-card {
            background: #14141f;
            border: 1px solid #1e1e32;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }
        .logo { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 2rem; }
        .logo span { color: #6366f1; }
        .form-control {
            background: #0a0a0f;
            border: 1px solid #1e1e32;
            color: #f1f1f7;
            padding: 0.75rem 1rem;
            border-radius: 10px;
        }
        .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .form-label { color: #9494b8; font-weight: 500; font-size: 0.875rem; }
        .btn-register { background: #22c55e; border: none; padding: 0.75rem; font-weight: 600; border-radius: 10px; width: 100%; }
        .btn-register:hover { background: #16a34a; }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">✦ <span>AdForge</span></div>
        <p class="text-center text-muted mb-4" style="font-size: 0.875rem;">Create your AdForge account</p>
        
        {% if error %}
        <div class="error-msg"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email (optional)</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-register">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>
        
        <div class="text-center mt-3">
            <a href="/login" style="color: #6366f1; text-decoration: none; font-size: 0.875rem;">
                ← Already have an account? Sign In
            </a>
        </div>
    </div>
</body>
</html>
